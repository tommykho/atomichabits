# Build the static site for GitHub Pages and deploy it with the official Pages actions.
# The base path and origin come from actions/configure-pages, so the build follows the repo name
# (https://tommykho.github.io/hopbit/) or a custom domain automatically. The AI relay lives on Vercel
# because GitHub Pages has no server functions.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [claude/pensive-cray-kiis8w, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_RELAY_URL: https://hopbit-relay.vercel.app/api/relay
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
